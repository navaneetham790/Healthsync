# LAN URL used in doctor-verification invitation emails.  `localhost` only
# works on the same laptop; this address can be opened by other devices on the
# same Wi-Fi/LAN while the frontend is running.
app.doctor-application-url=${DOCTOR_APPLICATION_URL:http://10.255.197.114:5180/doctor-verification}

# ==========================================
# Database Configuration (Oracle / SQL Developer)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:system}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:naani123}

# ==========================================
# JPA / Hibernate settings (Oracle XE auto-detect)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

