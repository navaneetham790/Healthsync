# JWT Configuration
# ==========================================
jwt.secret=9a4f2c8d3e7b1a5c6d8e7f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c
jwt.expiration=86400000
password-reset.expiration=900000
health.service.url=${HEALTH_SERVICE_URL:http://localhost:8083}

# ==========================================
# Email Configuration (SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=${SMTP_PORT:465}
# Set SMTP_USERNAME and SMTP_PASSWORD in the environment; never commit email credentials.
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.password-reset-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}


